<!DOCTYPE html>
<html>
<head>
    <title>Pay for {{ project.name }}</title>
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
</head>
<body>
    <h1>Pay ₹{{ project.price }} for {{ project.name }}</h1>

    <button id="rzp-button">Pay ₹{{ project.price }}</button>

    <form id="payment-form" method="POST" action="{% url 'payment_success' %}">
      {% csrf_token %}
      <input type="hidden" name="razorpay_payment_id">
      <input type="hidden" name="razorpay_order_id">
      <input type="hidden" name="razorpay_signature">
    </form>

    <script>
        var options = {
            "key": "{{ key }}",
            "amount": "{{ amount_in_paise }}",
            "currency": "INR",
            "order_id": "{{ order_id }}",
            "handler": function (response){
                document.querySelector("[name=razorpay_payment_id]").value = response.razorpay_payment_id;
                document.querySelector("[name=razorpay_order_id]").value = response.razorpay_order_id;
                document.querySelector("[name=razorpay_signature]").value = response.razorpay_signature;
                document.getElementById("payment-form").submit();
            },
            "theme": {
                "color": "#3399cc"
            }
        };
        var rzp = new Razorpay(options);
        document.getElementById('rzp-button').onclick = function(e){
            rzp.open();
            e.preventDefault();
        }
    </script>
</body>
</html>
